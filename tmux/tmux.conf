# tmux config — Tokyo Night themed, sensible modern defaults.

# ===== General =====
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"
set  -g escape-time 0
set  -g history-limit 50000
set  -g focus-events on
set  -g mouse on
set  -g set-clipboard on
set  -g display-time 2000

# Number windows/panes from 1; keep them contiguous when one closes
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# Auto-rename windows from running command; monitor activity in bg windows
setw -g automatic-rename on
setw -g monitor-activity on
set  -g visual-activity off

# ===== Prefix: C-b (default — C-Space conflicts with Alfred) =====
set -g prefix C-b
bind C-b send-prefix

# ===== Bindings =====
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display " tmux config reloaded"

# Intuitive splits, open in current path
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick-access power bindings
bind Tab   last-window
bind Enter resize-pane -Z
bind S     setw synchronize-panes \; display-message 'Sync: #{?pane_synchronized,ON,OFF}'
bind C-l   send-keys 'C-l' \; clear-history \; display ' cleared'

# prefix + C-f: fzf-pick a project dir, attach/create a tmux session for it.
# Runs in a transient window that closes on exit. -r makes it repeatable.
# (Chose C-f rather than plain f to leave find-window alone.)
bind -r C-f run-shell "tmux neww tmux-sessionizer"

# Vi mode for copy, system clipboard on yank
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ===== Tokyo Night Theme =====
# Palette: bg #1a1b26, fg #c0caf5, blue #7aa2f7, purple #bb9af7,
#          cyan #73daca, amber #e0af68, red #f7768e, comment #565f89

# Dim inactive panes; full brightness on active
set -g window-style        'fg=#a9b1d6,bg=#16161e'
set -g window-active-style 'fg=#c0caf5,bg=#1a1b26'

set -g status-position top
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 50
set -g status-right-length 100
set -g status-interval 5

# Left: session pill (purple) with right-chevron close
set -g status-left "#[bg=#bb9af7,fg=#1a1b26,bold]  #S #[bg=#1a1b26,fg=#bb9af7]#[default] "

# Window list — inactive is muted; active is a full blue pill with chevrons,
# zoom flag shows "Z" when prefix-Enter zooms a pane
set -g window-status-format         "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#7aa2f7,bg=#1a1b26]#[bg=#7aa2f7,fg=#1a1b26,bold] #I:#W#{?window_zoomed_flag, Z,} #[fg=#7aa2f7,bg=#1a1b26]"
set -g window-status-separator      ""

# Activity / bell highlight (bg windows with output)
set -g window-status-activity-style "fg=#e0af68,bold"
set -g window-status-bell-style     "fg=#f7768e,bold,blink"

# Right: PREFIX flag (red when active) + amber clock pill with left-chevron
set -g status-right "#{?client_prefix,#[fg=#f7768e]#[bg=#f7768e#,fg=#1a1b26#,bold] PREFIX #[bg=#1a1b26#,fg=#f7768e],}#[fg=#e0af68]#[bg=#e0af68,fg=#1a1b26,bold] %H:%M #[default]"

# Pane borders
set -g pane-border-style        "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Command-line / messages
set -g message-style         "bg=#1a1b26,fg=#7aa2f7"
set -g message-command-style "bg=#1a1b26,fg=#e0af68"

# Copy-mode highlight
set -g mode-style "bg=#7aa2f7,fg=#1a1b26"
