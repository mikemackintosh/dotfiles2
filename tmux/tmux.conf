# tmux config — Tokyo Night themed, sensible modern defaults.

# ===== General =====
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"
set  -g escape-time 10
set  -g history-limit 50000
set  -g focus-events on
set  -g mouse on
set  -g set-clipboard on

# Number windows/panes from 1; keep them contiguous when one closes
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# ===== Prefix: C-Space =====
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ===== Bindings =====
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display " tmux config reloaded"

# Intuitive splits, open in current path
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi mode for copy, system clipboard on yank
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ===== Tokyo Night Theme =====
# Palette: bg #1a1b26, fg #c0caf5, blue #7aa2f7, purple #bb9af7,
#          cyan #73daca, amber #e0af68, red #f7768e, comment #565f89

set -g status-position top
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 50
set -g status-right-length 100
set -g status-interval 5

# Left: session name on purple, with chevron transition
set -g status-left "#[bg=#bb9af7,fg=#1a1b26,bold]  #S #[bg=#1a1b26,fg=#bb9af7]#[default] "

# Window list — current window highlighted in blue
set -g window-status-format         "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[bg=#7aa2f7,fg=#1a1b26,bold] #I:#W "
set -g window-status-separator      ""

# Right: PREFIX indicator (red when prefix active) + clock in amber
set -g status-right "#{?client_prefix,#[bg=#f7768e#,fg=#1a1b26#,bold] PREFIX ,}#[bg=#e0af68,fg=#1a1b26,bold] %H:%M "

# Pane borders
set -g pane-border-style        "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Command-line / messages
set -g message-style         "bg=#1a1b26,fg=#7aa2f7"
set -g message-command-style "bg=#1a1b26,fg=#e0af68"

# Copy-mode highlight
set -g mode-style "bg=#7aa2f7,fg=#1a1b26"
